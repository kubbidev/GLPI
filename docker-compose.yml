services:
  glpi:
    build:
      context: .
      args:
        GLPI_VERSION: ${GLPI_VERSION:-11.0.9}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: glpi:${GLPI_VERSION:-11.0.9}
    container_name: glpi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${GLPI_PORT:-8080}:80"
    volumes:
      - glpi-data:/var/glpi
      - glpi-marketplace:/var/www/glpi/marketplace

  db:
    image: mariadb:11.8
    container_name: glpi-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Europe/Paris}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - glpi-db:/var/lib/mysql
      - ./initdb-timezones.sh:/docker-entrypoint-initdb.d/99-timezones.sh:ro

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
      TZ: ${TZ:-Europe/Paris}
    # not published: reached through the glpi container at /phpmyadmin/

volumes:
  glpi-data:
  glpi-db:
  glpi-marketplace:
