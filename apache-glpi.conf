<VirtualHost *:80>
    DocumentRoot /var/www/glpi/public

    # phpMyAdmin container, served under the same host/port
    RedirectMatch ^/phpmyadmin$ /phpmyadmin/
    ProxyPass        /phpmyadmin/ http://phpmyadmin/ retry=0
    ProxyPassReverse /phpmyadmin/ http://phpmyadmin/
    ProxyPassReverse /phpmyadmin/ /
    ProxyPassReverseCookiePath / /phpmyadmin/
    <Location /phpmyadmin/>
        ProxyAddHeaders Off
    </Location>

    <Directory /var/www/glpi/public>
        Require all granted
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
